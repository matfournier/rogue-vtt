<!-- templates/create_room.html -->
{% extends "base.html" %}

{% block content %}

<div class="hero min-h-screen">
  <div class="hero-content flex-col lg:flex-flow-reverse">
    <div class="card shrink-0 w-full max-w-sm shadow-2xl bg-base-100">
      <form class="card-body" hx-post="/v1/room" hx-trigger="submit">
        <h2 class="card-title mb-4">Create New Room</h2>

        <div class="form-control">
          <label class="label"><span class="label-text">Room Name</span></label>
          <input type="text" name="name" placeholder="Enter room name" class="input input-bordered" required /> 
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text">Password</span></label>
          <input type="password" name="password" placeholder="Enter room password" class="input input-bordered" required /> 
        </div>
        
        <div class="form-control mt-6">
          <button class="btn btn-primary">Create</button>
        </div>

        <div class="form-control">
          <button type="button" class="btn btn-ghost" hx-get="/" hx-target="#main-content">Back to Login</button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
