<!-- templates/index.html -->
{% extends "base.html" %}

{% block content %}

<div class="hero min-h-screen">
  <div class="hero-content flex-col lg:flex-flow-reverse">
    <div class="card shrink-0 w-full max-w-sm shadow-2xl bg-base-100">
      <form class="card-body" hx-post="/login" hx-trigger="submit">
        <h2 class="card-title mb-4">Login</h2>

        <div class="form-control">
          <label class="label"><span class="label-text">Room ID</span></label>
          <input type="text" name="id" placeholder="Enter Room ID" class="input input-bordered" required /> 
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text">Room Key</span></label>
          <input type="password" name="key" placeholder="Enter Room Key" class="input input-bordered" required /> 
        </div>
        
        <div class="form-control mt-6">
          <div class="flex gap-4">
            <button class="btn btn-primary flex-1">Login</button>
            <button type="button" class="btn btn-primary flex-1" hx-get="/v1/create_room" hx-target="#main-content">Create Room</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
